# 인기 카드뉴스 탭 데이터 — 브라이트데이터 예비 수집 (수동 실행 전용, 크레딧 듦)
# 평소 매일 수집은 이 맥의 Aside 루틴(scripts/hot/aside-collect.mjs, 무료)이 한다.
# Aside 쪽이 막혔을 때만 GitHub > Actions > 이 워크플로 > Run workflow 로 돌린다.
name: 인기 카드뉴스 수집

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hot-posts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 지난 데이터 가져오기
        run: |
          if git ls-remote --exit-code --heads origin hot-data >/dev/null; then
            git clone --depth 1 --branch hot-data "https://github.com/${{ github.repository }}.git" hot-data
            rm -rf hot-data/.git
          else
            mkdir hot-data
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 썸네일 도구 설치
        run: npm i --prefix /tmp/sharp sharp@0.34.5 --no-save --silent

      - name: 수집
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          SHARP_PATH: /tmp/sharp/node_modules/sharp/lib/index.js
          HOT_DIR: hot-data
        run: node scripts/hot/collect.mjs

      - name: hot-data 브랜치에 저장 (기록은 매번 1개만 남겨 저장소가 커지지 않게)
        run: |
          cd hot-data
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b hot-data
          git config user.name "hot-posts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "인기 카드뉴스 데이터 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hot-data
